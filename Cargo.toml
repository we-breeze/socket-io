[package]
name = "brz-socket-io"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
description = "Provider-based Socket.IO services for Breeze applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/socket-io"
readme = "README.md"
exclude = ["tests/client/node_modules/**"]

[workspace]
members = ["macros"]
resolver = "3"

[dependencies]
brz-http-server = { version = "=0.0.33", features = ["hyper"] }
socket-io-macros = { path = "macros", version = "=0.0.1", package = "brz-socket-io-macros", optional = true }
inventory = { version = "0.3", optional = true }
engineioxide = "=0.17.7"
socketioxide = { version = "=0.18.7", features = ["state", "extensions", "tracing"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
http = "1"
brz-metrics = { version = "=0.0.13", optional = true }
redis-client = { package = "redis", version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
socketioxide-redis = { version = "=0.4.3", default-features = false, optional = true }

[dev-dependencies]
brz-http-gateway = { version = "=0.2.13" }
brz-http-server = { version = "=0.0.33", features = ["hyper", "macros"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tokio-tungstenite = "0.29"
serde_bytes = "0.11"

[features]
default = ["metrics"]
macros = ["dep:socket-io-macros", "dep:inventory"]
metrics = ["dep:brz-metrics"]
redis = ["dep:redis-client", "dep:socketioxide-redis"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "redis"
required-features = ["redis"]

[[example]]
name = "gateway"

[[test]]
name = "redis"
required-features = ["redis"]

[[example]]
name = "http"
required-features = ["macros"]
