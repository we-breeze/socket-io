name: Publish

on:
  workflow_dispatch:
    inputs:
      retry_tag:
        description: 'Retry an unpublished existing tag; leave empty for next version'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      BRZ_SOCKET_IO_TEST_REDIS_URL: redis://127.0.0.1:6379
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RETRY_TAG: ${{ inputs.retry_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Configure an accessible CARGO_REGISTRY_TOKEN Actions secret first.'; exit 1; }
      - name: Prepare release version
        id: release
        run: python3 .github/scripts/prepare-release.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --locked --all-features
      - run: cargo test --workspace --locked --no-default-features
      - run: cargo test --workspace --locked --release --all-features
      - name: Verify publishable package
        run: cargo publish -p brz-socket-io-macros --locked --dry-run --registry crates-io
      - name: Push version commit and tag atomically
        if: inputs.retry_tag == ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/publish-packages.py
